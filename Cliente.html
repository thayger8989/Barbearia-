<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agendar Horário</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#14213d;--mut:#5b6678;--bd:#d6dce4;--red:#c8372d;--blue:#1d4e89;--ok:#2e7d4f;--btn:#14213d;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2230;--tx:#eef1f6;--mut:#9aa6ba;--bd:#2c3648;--red:#e4574d;--blue:#5b9be0;--ok:#5cc08a;--btn:#eef1f6;--btnt:#10151f}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2230;--tx:#eef1f6;--mut:#9aa6ba;--bd:#2c3648;--red:#e4574d;--blue:#5b9be0;--ok:#5cc08a;--btn:#eef1f6;--btnt:#10151f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:16px}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:0}
.sub{color:var(--mut);font-size:14px;margin:4px 0 12px}
.pole{height:10px;border-radius:5px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,var(--card) 12px 24px,var(--blue) 24px 36px,var(--card) 36px 48px);border:1px solid var(--bd);margin:10px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
form{display:grid;gap:10px}
label{font-size:14px;color:var(--mut);display:grid;gap:4px}
input,select{padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
button.b{padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
button.p{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.mut{color:var(--mut);font-size:14px}
.nm{font-weight:700}
.hide{display:none}
.msg{margin-top:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);font-size:14px}
.msg.ok{color:var(--ok);border-color:var(--ok)}
.msg.err{color:var(--red);border-color:var(--red)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<h1 id="nome-barbearia">Barbearia</h1>
<p class="sub" id="status-barbearia">Carregando informações da barbearia...</p>
<div class="pole"></div>

<div class="card" id="box-form">
  <form id="form-agendamento">
    <label>Seu nome completo
      <input id="cliente-nome" type="text" required autocomplete="name" placeholder="Ex.: Lucas Almeida">
    </label>
    <label>WhatsApp (opcional)
      <input id="cliente-tel" type="tel" autocomplete="tel" placeholder="Ex.: (71) 99999-9999">
    </label>
    <label>Serviço
      <select id="servico-select" required></select>
    </label>
    <div class="grid">
      <label>Data
        <input id="data-input" type="date" required>
      </label>
      <label>Horário
        <input id="hora-input" type="time" required>
      </label>
    </div>
    <label>Forma de pagamento
      <select id="pagamento-select">
        <option value="local">Pagar no local</option>
        <option value="app">Pagar no app (Pix)</option>
      </select>
    </label>
    <div id="pix-box" class="card hide"></div>
    <button class="b p" type="submit" id="btn-enviar">Confirmar agendamento</button>
  </form>
  <div id="msg-box" class="msg hide"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL="https://uklmnvkpigftxjmafghr.supabase.co";
var SUPABASE_KEY="sb_publishable_stpLatXXopEoqkaOOXfFsg_K1hKBKWM";
var BARBEARIA_ID=(new URLSearchParams(window.location.search).get("barbearia")||"c59372f5-536c-4127-bab0-7ac1c3950135").trim();

var sbClient=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
var SERVICOS={};
var PIX={k:"",n:"",c:""};

function $(id){return document.getElementById(id)}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function brl(n){return "R$ "+Number(n||0).toFixed(2).replace(".",",")}

function setMsg(texto,tipo){
  var el=$("msg-box");
  if(!texto){el.className="msg hide";el.textContent="";return}
  el.className="msg "+(tipo||"");
  el.textContent=texto;
}

function bloquearFormulario(mensagem){
  $("form-agendamento").classList.add("hide");
  $("status-barbearia").textContent=mensagem;
}

function crc(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function tl(id,v){return id+String(v.length).padStart(2,"0")+v}
function clean(t,n){return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").toUpperCase().trim().slice(0,n)}
function brcode(v){var p=tl("00","01")+tl("26",tl("00","br.gov.bcb.pix")+tl("01",PIX.k.trim()))+tl("52","0000")+tl("53","986")+(v>0?tl("54",v.toFixed(2)):"")+tl("58","BR")+tl("59",clean(PIX.n,25)||"BARBEARIA")+tl("60",clean(PIX.c,15)||"BRASIL")+tl("62",tl("05","***"))+"6304";return p+crc(p)}

function copiarTexto(tx,btn){
  var orig=btn.textContent;
  function ok(){btn.textContent="Copiado!";setTimeout(function(){btn.textContent=orig},1500)}
  function fb(){
    var ta=document.createElement("textarea");
    ta.value=tx;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");ok()}catch(e){btn.textContent="Erro ao copiar"}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(ok,fb)}else fb();
}

function renderPix(){
  var box=$("pix-box");
  if($("pagamento-select").value!=="app"){box.className="card hide";return}
  box.className="card";
  if(!PIX.k.trim()){
    box.innerHTML='<div class="mut">A barbearia ainda não cadastrou chave Pix. Você pode agendar e pagar no local.</div>';
    return;
  }
  var srv=SERVICOS[$("servico-select").value];
  var valor=srv?Number(srv.valor):0;
  box.innerHTML='<div class="mut">Chave Pix da barbearia</div><div class="nm">'+esc(PIX.k)+'</div><div class="mut">Valor: '+brl(valor)+' · Duração: '+(srv?srv.duracao_min:30)+' min</div><div class="acts"><button type="button" class="b" id="cp-chave">Copiar chave Pix</button><button type="button" class="b p" id="cp-copia-cola">Copiar Pix copia e cola</button></div>';
  $("cp-chave").addEventListener("click",function(){copiarTexto(PIX.k.trim(),this)});
  $("cp-copia-cola").addEventListener("click",function(){copiarTexto(brcode(valor),this)});
}

function preencherServicos(lista){
  var sel=$("servico-select");
  sel.innerHTML="";
  SERVICOS={};
  lista.forEach(function(s){
    SERVICOS[s.id]=s;
    var opt=document.createElement("option");
    opt.value=s.id;
    opt.textContent=s.nome+" — "+brl(s.valor)+" ("+s.duracao_min+" min)";
    sel.appendChild(opt);
  });
  renderPix();
}

function carregarDados(){
  if(!BARBEARIA_ID){
    bloquearFormulario("Link inválido: informe ?barbearia=UUID na URL.");
    return;
  }
  if(!sbClient){
    bloquearFormulario("Erro ao carregar SDK do Supabase.");
    return;
  }

  sbClient.from("barbearias")
    .select("id,nome,pix_chave,pix_nome,pix_cidade")
    .eq("id",BARBEARIA_ID)
    .single()
    .then(function(res){
      if(res.error||!res.data){
        bloquearFormulario("Barbearia não encontrada para este link.");
        return;
      }
      $("nome-barbearia").textContent=res.data.nome||"Barbearia";
      document.title=(res.data.nome||"Barbearia")+" — Agendar";
      PIX={
        k:res.data.pix_chave||"",
        n:res.data.pix_nome||"",
        c:res.data.pix_cidade||""
      };
      $("status-barbearia").textContent="Escolha seu serviço, data e horário.";

      sbClient.from("servicos")
        .select("id,nome,valor,duracao_min")
        .eq("barbearia_id",BARBEARIA_ID)
        .eq("ativo",true)
        .order("nome",{ascending:true})
        .then(function(sRes){
          if(sRes.error||!sRes.data||!sRes.data.length){
            bloquearFormulario("Nenhum serviço disponível no momento para esta barbearia.");
            return;
          }
          preencherServicos(sRes.data);
        });
    });
}

$("servico-select").addEventListener("change",renderPix);
$("pagamento-select").addEventListener("change",renderPix);

$("form-agendamento").addEventListener("submit",function(e){
  e.preventDefault();
  setMsg("","");
  if(!sbClient||!BARBEARIA_ID)return;

  var srvId=$("servico-select").value;
  var srv=SERVICOS[srvId];
  if(!srv){setMsg("Selecione um serviço válido.","err");return}

  var clienteNome=$("cliente-nome").value.trim();
  var clienteTel=$("cliente-tel").value.trim();
  var dataVal=$("data-input").value;
  var horaVal=$("hora-input").value;
  var pagamentoVal=$("pagamento-select").value;

  if(!clienteNome||!dataVal||!horaVal){
    setMsg("Preencha nome, data e horário.","err");
    return;
  }

  $("btn-enviar").disabled=true;
  $("btn-enviar").textContent="Enviando...";

  var payload={
    barbearia_id:BARBEARIA_ID,
    servico_id:srvId,
    cliente_nome:clienteNome,
    cliente_telefone:clienteTel||null,
    data:dataVal,
    hora:horaVal,
    valor:Number(srv.valor),
    duracao_min:Number(srv.duracao_min),
    pagamento:pagamentoVal,
    pago:false,
    status:"agendado"
  };

  sbClient.from("agendamentos").insert(payload).then(function(res){
    $("btn-enviar").disabled=false;
    $("btn-enviar").textContent="Confirmar agendamento";
    if(res.error){
      setMsg("Não foi possível enviar o agendamento: "+res.error.message,"err");
      return;
    }
    $("cliente-nome").value="";
    $("cliente-tel").value="";
    setMsg("Agendamento enviado com sucesso! A barbearia já recebeu sua solicitação.","ok");
  });
});

$("data-input").value=new Date().toISOString().slice(0,10);
carregarDados();
</script>
</body>
</html>
