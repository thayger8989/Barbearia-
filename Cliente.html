<style>
*{box-sizing:border-box}
html{background:radial-gradient(ellipse at 50% 0,rgba(185,130,48,.18),transparent 50%),radial-gradient(ellipse at 10% 80%,rgba(160,30,30,.15),transparent 40%),radial-gradient(ellipse at 90% 85%,rgba(30,70,150,.12),transparent 34%),linear-gradient(135deg,#0a0a0d,#15151b 50%,#0a0a0d),#09090c;background-attachment:fixed;background-repeat:no-repeat;color-scheme:dark}
body{margin:0;min-height:100vh;color:#f4ecd8;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.side{position:fixed;top:0;height:100vh;width:auto;overflow:visible;display:none;pointer-events:none;z-index:-1}
.sl{left:0}.sr{right:0}
@media(min-width:1000px){.side{display:block}}
.wrap{max-width:540px;margin:0 auto;padding:18px 16px 26px;display:flex;flex-direction:column;align-items:center;gap:12px}
.logo{width:min(330px,80vw);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.7))}
.tag2{font:italic 700 21px/1 "Segoe Script","Brush Script MT",cursive;color:#e3b85a;margin-top:-4px}
@media(min-width:1000px){.tag2{display:none}}
.card{width:100%;position:relative;background:linear-gradient(160deg,rgba(24,24,28,.96),rgba(8,8,11,.97));border:1.5px solid #c9a05a;border-radius:20px;padding:22px 26px 26px;box-shadow:0 22px 60px rgba(0,0,0,.65),0 0 40px rgba(201,160,90,.15),inset 0 0 30px rgba(0,0,0,.5)}
.card:after{content:"";position:absolute;left:25%;right:25%;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,#f3d58a,transparent)}
h1{font:700 30px/1.15 Georgia,"Times New Roman",serif;color:#fff;margin:0}
.sub{color:#d8cdb9;margin:6px 0 16px;font:15px/1.4 Georgia,serif}
form{display:grid;gap:12px}
label{display:grid;gap:5px;font-size:14px;color:#d5b77f}
input,select{width:100%;height:52px;padding:0 14px;background:#0a0a0c;border:1.5px solid #8a6a38;border-radius:11px;color:#fff;font-size:17px;font-family:inherit}
input::placeholder{color:#8d8a84}
input:focus,select:focus{outline:none;border-color:#f0cd7e;box-shadow:0 0 0 3px rgba(240,205,126,.15)}
option{background:#15151a;color:#f4ecd8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{height:58px;margin-top:4px;border-radius:11px;border:1px solid #f3d58a;background:linear-gradient(180deg,#f0d38c,#cfa24f 55%,#b98737);color:#1a1308;font-size:19px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.5),0 6px 18px rgba(0,0,0,.4);transition:filter .2s,transform .2s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:12px;font-size:14px;font-weight:600;color:#d8cdb9}
.ok{color:#6fd09a}.err{color:#ff8d84}
.foot{display:flex;flex-direction:column;align-items:center;gap:6px;color:#d9c9a5;font:12px Georgia,serif;letter-spacing:3px;text-align:center}
.stars{display:flex;align-items:center;gap:14px;color:#e3b85a;width:min(340px,80vw);font-size:15px;letter-spacing:0}
.stars big{font-size:24px}
.stars:before,.stars:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#b98d45)}
.stars:after{transform:scaleX(-1)}
@media(max-width:420px){.card{padding:18px 16px 20px}.grid{grid-template-columns:1fr}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://uklmnvkpigftxjmafghr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_stpLatXXopEoqkaOOXfFsg_K1hKBKWM";

    // Podes passar ?barbearia=UUID na URL ou usar o UUID fixo da Vortex Studio
    const params = new URLSearchParams(window.location.search);
    const BARBEARIA_ID = params.get("barbearia") || "c59372f5-536c-4127-bab0-7ac1c3950135";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const msgEl = document.getElementById("cli-msg");
    const srvEl = document.getElementById("cli-srv");
    const btnEl = document.getElementById("cli-btn");

    // Define data de hoje por padrão
    const hoje = new Date().toISOString().split("T")[0];
    document.getElementById("cli-data").value = hoje;

    function setMsg(texto, tipo) {
      msgEl.textContent = texto;
      msgEl.className = "msg " + (tipo || "");
    }

    function formatBRL(v) {
      return "R$ " + Number(v || 0).toFixed(2).replace(".", ",");
    }

    async function carregarServicos() {
      if (!BARBEARIA_ID || BARBEARIA_ID === "COLE_AQUI_O_UUID_DA_BARBEARIA") {
        srvEl.innerHTML = '<option value="">Configure o ID da barbearia</option>';
        setMsg("Falta configurar o ID da barbearia no código ou na URL (?barbearia=ID).", "err");
        return;
      }

      const { data, error } = await sb.rpc("listar_servicos_publico", {
        p_barbearia_id: BARBEARIA_ID
      });

      if (error) {
        srvEl.innerHTML = '<option value="">Erro ao carregar</option>';
        setMsg("Não foi possível carregar os serviços: " + error.message, "err");
        return;
      }

      if (!data || !data.length) {
        srvEl.innerHTML = '<option value="">Nenhum serviço disponível</option>';
        setMsg("Nenhum serviço ativo encontrado para esta barbearia.", "err");
        return;
      }

      srvEl.innerHTML = data.map((s) =>
        `<option value="${s.id}">${s.nome} (${formatBRL(s.valor)} · ${s.duracao_min} min)</option>`
      ).join("");
    }

    document.getElementById("form-cliente").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!srvEl.value) return;

      btnEl.disabled = true;
      setMsg("A enviar agendamento...", "");

      const { error } = await sb.rpc("criar_agendamento_publico", {
        p_barbearia_id: BARBEARIA_ID,
        p_servico_id: srvEl.value,
        p_cliente_nome: document.getElementById("cli-nome").value.trim(),
        p_cliente_telefone: document.getElementById("cli-tel").value.trim() || null,
        p_data: document.getElementById("cli-data").value,
        p_hora: document.getElementById("cli-hora").value,
        p_pagamento: document.getElementById("cli-pag").value
      });

      btnEl.disabled = false;

      if (error) {
        setMsg("Erro ao agendar: " + error.message, "err");
        return;
      }

      document.getElementById("form-cliente").reset();
      document.getElementById("cli-data").value = hoje;
      setMsg("Agendamento confirmado! A barbearia já recebeu o aviso.", "ok");
    });

    carregarServicos();
  </script>
</body>
</html>
